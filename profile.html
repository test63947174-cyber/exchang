<div class="container">
  <div class="page-head">
    <h1>My <span>Profile</span></h1>
    <p>Manage your account information.</p>
  </div>

  <div class="form-card" style="background:var(--bg-card);backdrop-filter:blur(18px);border:1px solid rgba(0,240,255,0.15);border-radius:20px;padding:32px 30px;max-width:700px;">
    <div style="text-align:center; margin-bottom:24px;">
      <div id="bigAvatar" style="width:90px;height:90px;border-radius:50%;margin:0 auto 12px;background:linear-gradient(135deg,var(--neon-cyan),var(--neon-purple));display:grid;place-items:center;font-family:'Orbitron',sans-serif;font-size:2.2rem;font-weight:900;color:#041018;">U</div>
      <button class="btn btn-ghost" style="padding:8px 18px;font-size:0.8rem;">📷 Change Avatar</button>
    </div>

    <div class="form-group" style="margin-bottom:18px;">
      <label style="display:block;font-size:0.78rem;font-weight:500;color:var(--text-dim);margin-bottom:7px;text-transform:uppercase;">Full Name</label>
      <input type="text" id="profileName" style="width:100%;padding:13px 16px;background:rgba(5,10,25,0.75);border:1px solid rgba(0,240,255,0.18);border-radius:11px;color:var(--text-main);font-size:0.92rem;outline:none;" />
    </div>

    <div class="form-group" style="margin-bottom:18px;">
      <label style="display:block;font-size:0.78rem;font-weight:500;color:var(--text-dim);margin-bottom:7px;text-transform:uppercase;">Email (read-only)</label>
      <input type="email" id="profileEmail" disabled style="width:100%;padding:13px 16px;background:rgba(5,10,25,0.5);border:1px solid rgba(0,240,255,0.1);border-radius:11px;color:var(--text-dim);font-size:0.92rem;outline:none;cursor:not-allowed;" />
    </div>

    <div class="form-group" style="margin-bottom:18px;">
      <label style="display:block;font-size:0.78rem;font-weight:500;color:var(--text-dim);margin-bottom:7px;text-transform:uppercase;">Phone Number</label>
      <input type="tel" id="profilePhone" placeholder="+91 98765 43210" style="width:100%;padding:13px 16px;background:rgba(5,10,25,0.75);border:1px solid rgba(0,240,255,0.18);border-radius:11px;color:var(--text-main);font-size:0.92rem;outline:none;" />
    </div>

    <div class="form-group" style="margin-bottom:18px;">
      <label style="display:block;font-size:0.78rem;font-weight:500;color:var(--text-dim);margin-bottom:7px;text-transform:uppercase;">Country</label>
      <select id="profileCountry" style="width:100%;padding:13px 16px;background:rgba(5,10,25,0.75);border:1px solid rgba(0,240,255,0.18);border-radius:11px;color:var(--text-main);font-size:0.92rem;outline:none;">
        <option value="IN">🇮🇳 India</option>
        <option value="US">🇺🇸 United States</option>
        <option value="UK">🇬🇧 United Kingdom</option>
        <option value="AE">🇦🇪 UAE</option>
        <option value="SG">🇸🇬 Singapore</option>
        <option value="other">Other</option>
      </select>
    </div>

    <button id="saveProfileBtn" style="width:100%;padding:15px;margin-top:12px;border:none;border-radius:11px;font-family:'Orbitron',sans-serif;font-size:0.95rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#041018;cursor:pointer;background:linear-gradient(90deg,var(--neon-cyan),var(--neon-green));box-shadow:0 0 24px rgba(0,240,255,0.4);">
      Save Changes
    </button>
  </div>
</div>
