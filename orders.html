<!-- orders.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orders — Nexbit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Same common CSS from wallet.html */
    * { margin:0; padding:0; box-sizing:border-box; }
    :root { --bg-dark:#050814; --bg-mid:#0a0f24; --bg-card:rgba(15,22,48,0.65); --neon-cyan:#00f0ff; --neon-green:#00ffa3; --neon-purple:#7b5cff; --text-main:#eaf6ff; --text-dim:#8b9bc0; --danger:#ff4d6d; --success:#00ffa3; }
    body { font-family:'Poppins',sans-serif; color:var(--text-main); background: linear-gradient(135deg, var(--bg-dark), var(--bg-mid)); background-attachment:fixed; min-height:100vh; }
    body::before, body::after { content:""; position:fixed; border-radius:50%; filter:blur(140px); z-index:0; pointer-events:none; }
    body::before { width:500px;height:500px; background:rgba(0,240,255,0.12); top:-180px; left:-180px; }
    body::after  { width:520px;height:520px; background:rgba(123,92,255,0.12); bottom:-200px; right:-200px; }

    .navbar { position:sticky; top:0; z-index:100; display:flex; align-items:center; justify-content:space-between; gap:14px; padding:14px 5%; background:rgba(5,8,20,0.78); backdrop-filter:blur(18px); border-bottom:1px solid rgba(0,240,255,0.12); }
    .nav-left { display:flex; align-items:center; gap:14px; }
    .hamburger { background:rgba(0,240,255,0.06); border:1px solid rgba(0,240,255,0.25); border-radius:10px; padding:8px 10px; cursor:pointer; display:flex; flex-direction:column; gap:4px; }
    .hamburger span { display:block; width:22px; height:2px; background:var(--neon-cyan); border-radius:2px; }
    .nav-brand { display:flex; align-items:center; gap:10px; font-family:'Orbitron',sans-serif; font-size:1.25rem; font-weight:800; text-decoration:none; }
    .logo-icon { width:34px; height:34px; display:grid; place-items:center; border-radius:10px; font-size:16px; font-weight:800; color:#041018; background: linear-gradient(135deg, var(--neon-cyan), var(--neon-green)); }
    .brand-gradient { background: linear-gradient(90deg, var(--neon-cyan), var(--neon-green), var(--neon-purple)); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .nav-actions { display:flex; align-items:center; gap:10px; }
    .user-chip { display:flex; align-items:center; gap:10px; padding:5px 14px 5px 5px; background:rgba(0,240,255,0.08); border:1px solid rgba(0,240,255,0.3); border-radius:50px; }
    .user-avatar { width:30px; height:30px; border-radius:50%; background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple)); display:grid; place-items:center; font-weight:700; color:#041018; font-size:0.82rem; }
    .user-chip span { font-size:0.82rem; }
    .btn { padding:9px 20px; border-radius:10px; font-family:inherit; font-size:0.83rem; font-weight:600; cursor:pointer; text-decoration:none; border:none; transition:all 0.25s; display:inline-block; }
    .btn-ghost { background:transparent; color:var(--text-main); border:1px solid rgba(0,240,255,0.35); }

    .sidebar { position:fixed; top:0; left:0; bottom:0; width:290px; max-width:85vw; background:rgba(6,10,26,0.97); backdrop-filter:blur(22px); border-right:1px solid rgba(0,240,255,0.15); padding:22px 0 20px; transform:translateX(-100%); transition:transform 0.35s cubic-bezier(0.22,1,0.36,1); z-index:300; display:flex; flex-direction:column; overflow-y:auto; }
    .sidebar.open { transform:translateX(0); }
    .sidebar-head { display:flex; align-items:center; justify-content:space-between; padding:0 20px 20px; border-bottom:1px solid rgba(0,240,255,0.12); margin-bottom:16px; }
    .logo-wrap { display:flex; align-items:center; gap:10px; }
    .logo-wrap .logo-icon { width:38px; height:38px; font-size:18px; }
    .logo-wrap .brand-gradient { font-family:'Orbitron',sans-serif; font-size:1.15rem; font-weight:800; }
    .sidebar-close { background:none; border:none; color:var(--text-dim); font-size:1.3rem; cursor:pointer; padding:4px 8px; }
    .sidebar-menu { flex:1; display:flex; flex-direction:column; padding:0 12px; gap:4px; }
    .menu-item { display:flex; align-items:center; gap:14px; padding:12px 16px; border-radius:11px; color:var(--text-main); text-decoration:none; font-size:0.92rem; font-weight:500; transition:all 0.22s; }
    .menu-item:hover { background:rgba(0,240,255,0.08); color:var(--neon-cyan); }
    .menu-item.active { background: linear-gradient(90deg, rgba(0,240,255,0.15), rgba(0,255,163,0.08)); color:var(--neon-cyan); border-left:3px solid var(--neon-cyan); }
    .mi-icon { font-size:1.15rem; width:22px; text-align:center; }
    .menu-divider { height:1px; background: linear-gradient(90deg, transparent, rgba(0,240,255,0.25), transparent); margin:12px 8px; }
    .sidebar-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.6); opacity:0; pointer-events:none; transition:opacity 0.3s; z-index:250; }
    .sidebar-overlay.show { opacity:1; pointer-events:auto; }

    .container { position:relative; z-index:1; max-width:1300px; margin:0 auto; padding:30px 5% 60px; }
    .page-head { margin-bottom:24px; }
    .page-head h1 { font-family:'Orbitron',sans-serif; font-size: clamp(1.5rem, 3vw, 2.2rem); font-weight:800; margin-bottom:6px; }
    .page-head h1 span { background: linear-gradient(90deg, var(--neon-cyan), var(--neon-green)); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .page-head p { color:var(--text-dim); font-size:0.9rem; }

    .tabs { display:flex; gap:8px; margin-bottom:22px; flex-wrap:wrap; }
    .tab-btn { padding:10px 22px; border-radius:50px; background:rgba(15,22,48,0.7); border:1px solid rgba(0,240,255,0.2); color:var(--text-dim); font-size:0.85rem; font-weight:500; cursor:pointer; font-family:inherit; transition:all 0.25s; }
    .tab-btn:hover, .tab-btn.active { border-color:var(--neon-cyan); color:var(--neon-cyan); background:rgba(0,240,255,0.08); }

    .orders-table { width:100%; border-collapse:collapse; background:var(--bg-card); backdrop-filter:blur(18px); border:1px solid rgba(0,240,255,0.15); border-radius:18px; overflow:hidden; }
    .orders-table thead { background:rgba(0,240,255,0.06); }
    .orders-table th, .orders-table td { padding:14px 20px; text-align:left; font-size:0.87rem; }
    .orders-table th { color:var(--neon-cyan); font-size:0.72rem; font-weight:600; letter-spacing:1.2px; text-transform:uppercase; }
    .orders-table td { border-top:1px solid rgba(0,240,255,0.08); }
    .orders-table tr:hover td { background:rgba(0,240,255,0.04); }
    .badge { display:inline-block; padding:3px 12px; border-radius:20px; font-size:0.72rem; font-weight:600; }
    .badge.buy  { color:var(--neon-green); background:rgba(0,255,163,0.1); }
    .badge.sell { color:var(--danger); background:rgba(255,77,109,0.1); }
    .badge.pending { color:#ffbd2e; background:rgba(255,189,46,0.1); }
    .badge.filled  { color:var(--neon-cyan); background:rgba(0,240,255,0.1); }
    .badge.cancelled { color:var(--text-dim); background:rgba(139,155,192,0.1); }

    .toast { position:fixed; top:26px; left:50%; transform:translateX(-50%) translateY(-140px); background:rgba(5,15,30,0.96); border:1px solid var(--success); border-radius:12px; padding:14px 22px; color:var(--text-main); font-size:0.9rem; box-shadow:0 0 30px rgba(0,255,163,0.4); display:flex; align-items:center; gap:10px; z-index:999; opacity:0; transition:all 0.5s; }
    .toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
    .toast .check { width:22px; height:22px; display:grid; place-items:center; border-radius:50%; background:var(--success); color:#041018; font-weight:800; font-size:13px; }

    @media (max-width: 700px) {
      .navbar { padding:12px 4%; }
      .user-chip span { display:none; }
      .container { padding:20px 4% 40px; }
      .orders-table th:nth-child(1), .orders-table td:nth-child(1) { display:none; }
      .orders-table th, .orders-table td { padding:11px 12px; font-size:0.8rem; }
    }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="nav-left">
    <button class="hamburger" onclick="toggleSidebar()"><span></span><span></span><span></span></button>
    <a href="dashboard.html" class="nav-brand"><div class="logo-icon">₿</div><span class="brand-gradient">NEXBIT</span></a>
  </div>
  <div class="nav-actions">
    <div class="user-chip"><div class="user-avatar" id="userAvatar">U</div><span id="userName">Trader</span></div>
    <button class="btn btn-ghost" onclick="logoutUser()">Logout</button>
  </div>
</nav>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-head">
    <div class="logo-wrap"><div class="logo-icon">₿</div><span class="brand-gradient">NEXBIT</span></div>
    <button class="sidebar-close" onclick="toggleSidebar()">✕</button>
  </div>
  <nav class="sidebar-menu">
    <a href="dashboard.html"  class="menu-item"><span class="mi-icon">🏠</span> Dashboard</a>
    <a href="market.html"     class="menu-item"><span class="mi-icon">📈</span> Markets</a>
    <a href="trade.html"      class="menu-item"><span class="mi-icon">💱</span> Trade</a>
    <a href="wallet.html"     class="menu-item"><span class="mi-icon">💰</span> Wallet</a>
    <a href="orders.html"     class="menu-item active"><span class="mi-icon">📋</span> Orders</a>
    <a href="list-token.html" class="menu-item"><span class="mi-icon">🚀</span> List Token</a>
    <a href="profile.html"    class="menu-item"><span class="mi-icon">👤</span> Profile</a>
    <a href="settings.html"   class="menu-item"><span class="mi-icon">⚙️</span> Settings</a>
    <div class="menu-divider"></div>
    <a href="#" class="menu-item" onclick="logoutUser(event)"><span class="mi-icon">🚪</span> Logout</a>
  </nav>
</aside>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<div class="container">
  <div class="page-head">
    <h1>My <span>Orders</span></h1>
    <p>Track all your open, filled and cancelled orders.</p>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="open">Open Orders</button>
    <button class="tab-btn" data-tab="history">Order History</button>
    <button class="tab-btn" data-tab="trades">Trade History</button>
  </div>

  <div style="overflow-x:auto;">
    <table class="orders-table">
      <thead>
        <tr>
          <th>Date</th><th>Pair</th><th>Type</th>
          <th>Price</th><th>Amount</th><th>Status</th><th>Action</th>
        </tr>
      </thead>
      <tbody id="ordersBody"></tbody>
    </table>
  </div>
</div>

<div class="toast" id="toast"><span class="check">✓</span><span id="toastMsg">Done!</span></div>

<script type="module" src="orders.js"></script>
</body>
</html>
