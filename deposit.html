<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deposit USDT — Nexbit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ============ RESET & VARS ============ */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-dark: #050814;
      --bg-mid: #0a0f24;
      --bg-card: rgba(15, 22, 48, 0.65);
      --neon-cyan: #00f0ff;
      --neon-green: #00ffa3;
      --neon-purple: #7b5cff;
      --neon-pink: #ff2e93;
      --text-main: #eaf6ff;
      --text-dim: #8b9bc0;
      --danger: #ff4d6d;
      --success: #00ffa3;
      --warning: #ffbd2e;
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Poppins', sans-serif;
      color: var(--text-main);
      background: linear-gradient(135deg, var(--bg-dark), var(--bg-mid));
      background-attachment: fixed;
      min-height: 100vh;
      overflow-x: hidden;
    }
    body::before, body::after {
      content: ""; position: fixed; border-radius: 50%;
      filter: blur(140px); z-index: 0; pointer-events: none;
    }
    body::before { width: 500px; height: 500px; background: rgba(0,240,255,0.12); top: -180px; left: -180px; }
    body::after  { width: 520px; height: 520px; background: rgba(123,92,255,0.12); bottom: -200px; right: -200px; }

    /* ============ NAVBAR ============ */
    .navbar {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      gap: 14px; padding: 14px 5%;
      background: rgba(5,8,20,0.78);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(0,240,255,0.12);
    }
    .nav-left { display: flex; align-items: center; gap: 14px; }
    .hamburger {
      background: rgba(0,240,255,0.06);
      border: 1px solid rgba(0,240,255,0.25);
      border-radius: 10px; padding: 8px 10px;
      cursor: pointer; display: flex; flex-direction: column; gap: 4px;
    }
    .hamburger span { display: block; width: 22px; height: 2px; background: var(--neon-cyan); border-radius: 2px; }
    .nav-brand {
      display: flex; align-items: center; gap: 10px;
      font-family: 'Orbitron', sans-serif; font-size: 1.25rem; font-weight: 800;
      letter-spacing: 1.5px; text-decoration: none;
    }
    .logo-icon {
      width: 34px; height: 34px; display: grid; place-items: center;
      border-radius: 10px; font-size: 16px; font-weight: 800; color: #041018;
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-green));
      box-shadow: 0 0 18px rgba(0,240,255,0.55);
    }
    .brand-gradient {
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-green), var(--neon-purple));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .nav-actions { display: flex; align-items: center; gap: 10px; }
    .user-chip {
      display: flex; align-items: center; gap: 10px;
      padding: 5px 14px 5px 5px;
      background: rgba(0,240,255,0.08);
      border: 1px solid rgba(0,240,255,0.3);
      border-radius: 50px;
    }
    .user-avatar {
      width: 30px; height: 30px; border-radius: 50%;
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
      display: grid; place-items: center;
      font-weight: 700; color: #041018; font-size: 0.82rem;
    }
    .user-chip span { font-size: 0.82rem; font-weight: 500; }
    .btn {
      padding: 9px 20px; border-radius: 10px;
      font-family: inherit; font-size: 0.83rem; font-weight: 600;
      cursor: pointer; text-decoration: none; border: none;
      transition: all 0.25s; display: inline-block;
      white-space: nowrap;
    }
    .btn-ghost {
      background: transparent; color: var(--text-main);
      border: 1px solid rgba(0,240,255,0.35);
    }
    .btn-ghost:hover {
      border-color: var(--neon-cyan); color: var(--neon-cyan);
      box-shadow: 0 0 18px rgba(0,240,255,0.25);
    }
    .btn-primary {
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-green));
      color: #041018;
      box-shadow: 0 0 22px rgba(0,240,255,0.35);
    }
    .btn-primary:hover {
      box-shadow: 0 0 34px rgba(0,255,163,0.6);
      transform: translateY(-2px);
    }

    /* ============ SIDEBAR ============ */
    .sidebar {
      position: fixed; top: 0; left: 0; bottom: 0;
      width: 290px; max-width: 85vw;
      background: rgba(6,10,26,0.97);
      backdrop-filter: blur(22px);
      border-right: 1px solid rgba(0,240,255,0.15);
      padding: 22px 0 20px;
      transform: translateX(-100%);
      transition: transform 0.35s cubic-bezier(0.22,1,0.36,1);
      z-index: 300; display: flex; flex-direction: column;
      overflow-y: auto;
      box-shadow: 30px 0 60px rgba(0,0,0,0.5);
    }
    .sidebar.open { transform: translateX(0); }
    .sidebar-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px 20px;
      border-bottom: 1px solid rgba(0,240,255,0.12);
      margin-bottom: 16px;
    }
    .logo-wrap { display: flex; align-items: center; gap: 10px; }
    .logo-wrap .logo-icon { width: 38px; height: 38px; font-size: 18px; }
    .logo-wrap .brand-gradient {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.15rem; font-weight: 800;
      letter-spacing: 1.5px;
    }
    .sidebar-close {
      background: none; border: none;
      color: var(--text-dim); font-size: 1.3rem;
      cursor: pointer; padding: 4px 8px;
      border-radius: 6px; transition: all 0.2s;
    }
    .sidebar-close:hover { color: var(--danger); background: rgba(255,77,109,0.1); }
    .sidebar-menu {
      flex: 1; display: flex; flex-direction: column;
      padding: 0 12px; gap: 4px;
    }
    .menu-item {
      display: flex; align-items: center; gap: 14px;
      padding: 12px 16px; border-radius: 11px;
      color: var(--text-main); text-decoration: none;
      font-size: 0.92rem; font-weight: 500;
      transition: all 0.22s;
    }
    .menu-item:hover { background: rgba(0,240,255,0.08); color: var(--neon-cyan); padding-left: 20px; }
    .menu-item.active {
      background: linear-gradient(90deg, rgba(0,240,255,0.15), rgba(0,255,163,0.08));
      color: var(--neon-cyan);
      border-left: 3px solid var(--neon-cyan);
      padding-left: 16px;
    }
    .mi-icon { font-size: 1.15rem; width: 22px; text-align: center; }
    .menu-divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0,240,255,0.25), transparent);
      margin: 12px 8px;
    }
    .sidebar-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s; z-index: 250;
    }
    .sidebar-overlay.show { opacity: 1; pointer-events: auto; }

    /* ============ CONTAINER ============ */
    .container {
      position: relative; z-index: 1;
      max-width: 900px; margin: 0 auto;
      padding: 30px 5% 60px;
    }
    .page-head { margin-bottom: 24px; }
    .page-head h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1.5rem, 3vw, 2.2rem);
      font-weight: 800; margin-bottom: 6px;
    }
    .page-head h1 span {
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-green));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .page-head p { color: var(--text-dim); font-size: 0.9rem; }

    /* ============ BALANCE CARD ============ */
    .balance-card {
      position: relative;
      background: linear-gradient(135deg, rgba(0,240,255,0.12), rgba(123,92,255,0.12));
      backdrop-filter: blur(20px);
      border: 1px solid rgba(0,240,255,0.35);
      border-radius: 20px;
      padding: 24px 26px;
      margin-bottom: 24px;
      overflow: hidden;
    }
    .balance-card::before {
      content: ""; position: absolute; top: -50%; right: -20%;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(0,255,163,0.15), transparent 70%);
      border-radius: 50%; pointer-events: none;
    }
    .balance-label {
      font-size: 0.72rem; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--text-dim);
      margin-bottom: 6px; font-weight: 500;
    }
    .balance-amount {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 900; letter-spacing: 1px;
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-green));
      -webkit-background-clip: text; background-clip: text;
      color: transparent;
    }
    .balance-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(0,255,163,0.1);
      border: 1px solid rgba(0,255,163,0.25);
      color: var(--neon-green);
      font-size: 0.7rem; font-weight: 600;
      padding: 4px 12px; border-radius: 20px;
      margin-top: 10px;
    }

    /* ============ DEPOSIT CARD ============ */
    .deposit-card {
      background: var(--bg-card);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(0,240,255,0.2);
      border-radius: 22px;
      padding: 28px;
      position: relative;
      overflow: hidden;
      margin-bottom: 22px;
    }
    .deposit-card::before {
      content: ""; position: absolute;
      top: -60%; right: -20%;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(0,240,255,0.1), transparent 70%);
      border-radius: 50%; pointer-events: none;
    }
    .card-title {
      display: flex; align-items: center; gap: 10px;
      font-family: 'Orbitron', sans-serif;
      font-size: 1rem; font-weight: 700;
      margin-bottom: 18px; letter-spacing: 0.5px;
    }
    .card-title .ico { font-size: 1.15rem; }

    /* ============ QR + ADDRESS ============ */
    .qr-address-grid {
      display: grid;
      grid-template-columns: 200px 1fr;
      gap: 24px;
      align-items: start;
      position: relative;
    }
    .qr-box {
      background: #ffffff;
      padding: 12px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      width: 200px; height: 200px;
      box-shadow: 0 0 40px rgba(0,240,255,0.25);
    }
    .qr-box img {
      display: block;
      width: 100% !important;
      height: 100% !important;
      border-radius: 6px;
    }
    .qr-box.loading {
      background: rgba(0,240,255,0.05);
      border: 1px dashed rgba(0,240,255,0.3);
      color: var(--text-dim);
      font-size: 0.75rem;
      text-align: center;
      padding: 20px;
    }

    .address-block {}
    .address-label {
      font-size: 0.72rem;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 6px;
      font-weight: 600;
    }
    .address-value {
      font-family: 'Courier New', monospace;
      font-size: 0.82rem;
      word-break: break-all;
      padding: 12px 14px;
      background: rgba(0,240,255,0.06);
      border: 1px solid rgba(0,240,255,0.3);
      border-radius: 12px;
      color: var(--neon-cyan);
      margin-bottom: 10px;
      line-height: 1.5;
      min-height: 44px;
    }
    .address-value.loading {
      color: var(--text-dim);
      font-style: italic;
    }
    .address-actions {
      display: flex; gap: 8px; flex-wrap: wrap;
    }
    .address-actions .btn {
      padding: 9px 16px;
      font-size: 0.78rem;
    }

    /* Address note */
    .address-note {
      font-size: 0.72rem;
      color: var(--text-dim);
      margin-top: 12px;
      padding: 12px 14px;
      background: rgba(255,189,46,0.06);
      border: 1px solid rgba(255,189,46,0.25);
      border-left: 3px solid var(--warning);
      border-radius: 10px;
      line-height: 1.7;
    }
    .address-note strong { color: var(--warning); }
    .contract {
      font-family: 'Courier New', monospace;
      color: var(--neon-cyan);
      font-size: 0.68rem;
      word-break: break-all;
    }

    /* ============ STATUS PANEL ============ */
    .status-panel {
      margin-top: 20px;
      padding: 16px 18px;
      background: rgba(0,240,255,0.04);
      border: 1px solid rgba(0,240,255,0.15);
      border-radius: 12px;
    }
    .status-panel-title {
      font-size: 0.72rem;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 10px;
      font-weight: 600;
    }
    .status-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 0;
      font-size: 0.82rem;
    }
    .status-row + .status-row { border-top: 1px dashed rgba(0,240,255,0.08); }
    .status-label { color: var(--text-dim); }
    .status-value {
      font-weight: 600;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .status-value.waiting   { color: var(--text-dim); }
    .status-value.detected  { color: var(--warning); }
    .status-value.confirming{ color: var(--neon-cyan); }
    .status-value.credited  { color: var(--neon-green); }
    .status-value.failed    { color: var(--danger); }
    .pulse-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: currentColor;
      animation: pulse-dot 1.5s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%,100% { opacity: 1; transform: scale(1); }
      50%     { opacity: 0.4; transform: scale(0.85); }
    }

    /* Info alert */
    .info-alert {
      background: rgba(0,240,255,0.05);
      border: 1px solid rgba(0,240,255,0.18);
      border-left: 4px solid var(--neon-cyan);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 0.82rem;
      line-height: 1.7;
      margin-bottom: 18px;
      color: var(--text-main);
    }
    .info-alert strong { color: var(--neon-cyan); }
    .info-alert .no { color: var(--danger); font-weight: 700; }

    /* ============ RECENT DEPOSITS ============ */
    .deposit-item {
      display: flex; justify-content: space-between;
      align-items: center; flex-wrap: wrap; gap: 10px;
      padding: 14px 16px;
      background: rgba(5,10,25,0.5);
      border: 1px solid rgba(0,240,255,0.1);
      border-radius: 12px;
      margin-bottom: 10px;
      transition: all 0.3s ease;
    }
    .deposit-item:hover {
      border-color: rgba(0,240,255,0.3);
      transform: translateX(4px);
    }
    .deposit-item .amt {
      color: var(--neon-green);
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 1rem;
    }
    .deposit-item .date {
      color: var(--text-dim);
      font-size: 0.7rem;
      margin-top: 3px;
    }
    .deposit-item .badge-verified {
      color: var(--neon-green);
      font-size: 0.75rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .deposit-item .tx-link {
      font-size: 0.7rem;
      font-family: 'Courier New', monospace;
      color: var(--neon-cyan);
      text-decoration: none;
    }
    .deposit-item .tx-link:hover { text-decoration: underline; }
    .deposit-item .badges {
      display: flex; flex-wrap: wrap; gap: 6px;
      margin-top: 6px; justify-content: flex-end;
    }
    .badge-mini {
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 0.62rem;
      font-weight: 600;
    }
    .badge-block { background: rgba(0,255,163,0.1); color: var(--neon-green); }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-dim);
    }
    .empty-state .emoji { font-size: 2.4rem; margin-bottom: 10px; display: block; }
    .empty-state p { font-size: 0.85rem; }

    .loading-box {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-dim);
    }
    .spinner {
      display: inline-block;
      width: 30px; height: 30px;
      border-radius: 50%;
      border: 3px solid rgba(0,240,255,0.2);
      border-top-color: var(--neon-cyan);
      animation: spin 0.8s linear infinite;
      margin-bottom: 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ============ WARNING BOX ============ */
    .warning-box {
      margin-top: 20px;
      padding: 14px 18px;
      background: rgba(255,77,109,0.06);
      border: 1px solid rgba(255,77,109,0.3);
      border-left: 4px solid var(--danger);
      border-radius: 12px;
      display: flex;
      gap: 14px;
      align-items: flex-start;
      font-size: 0.82rem;
      line-height: 1.7;
    }
    .warning-box .icon { font-size: 1.4rem; flex-shrink: 0; line-height: 1.2; }
    .warning-box strong { color: var(--danger); }
    .warning-box ul {
      margin: 6px 0 0 18px;
      line-height: 1.8;
      color: var(--text-dim);
    }
    .warning-box li { margin-bottom: 3px; }

    /* ============ TOAST ============ */
    .toast-container {
      position: fixed; top: 24px; right: 24px;
      z-index: 9999; max-width: 400px;
    }
    .toast-custom {
      background: rgba(15,25,45,0.96);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(0,240,255,0.2);
      border-radius: 14px;
      padding: 14px 18px;
      color: var(--text-main);
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 10px;
      font-size: 0.88rem;
      animation: slideIn 0.35s cubic-bezier(0.4,0,0.2,1);
      transition: all 0.3s ease;
    }
    .toast-custom.success { border-left: 4px solid var(--neon-green); }
    .toast-custom.error   { border-left: 4px solid var(--danger); }
    .toast-custom.warning { border-left: 4px solid var(--warning); }
    .toast-custom.info    { border-left: 4px solid var(--neon-cyan); }
    .toast-custom .ico { font-size: 1.3rem; flex-shrink: 0; }
    @keyframes slideIn {
      from { transform: translateX(120%); opacity: 0; }
      to   { transform: translateX(0); opacity: 1; }
    }

    /* ============ RESPONSIVE ============ */
    @media (max-width: 700px) {
      .navbar { padding: 12px 4%; }
      .user-chip span { display: none; }
      .container { padding: 20px 4% 40px; }
      .deposit-card { padding: 22px; }
      .qr-address-grid {
        grid-template-columns: 1fr;
        justify-items: center;
        text-align: center;
      }
      .qr-box { width: 180px; height: 180px; }
      .address-actions { justify-content: center; }
      .toast-container { top: 12px; right: 12px; left: 12px; max-width: none; }
    }
    @media (max-width: 480px) {
      .qr-box { width: 160px; height: 160px; }
      .address-value { font-size: 0.72rem; }
      .address-actions .btn { width: 100%; text-align: center; }
    }
  </style>
</head>
<body>

<!-- ================= TOAST ================= -->
<div class="toast-container" id="toastContainer"></div>

<!-- ================= NAVBAR ================= -->
<nav class="navbar">
  <div class="nav-left">
    <button class="hamburger" onclick="toggleSidebar()" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <a href="dashboard.html" class="nav-brand">
      <div class="logo-icon">₿</div>
      <span class="brand-gradient">NEXBIT</span>
    </a>
  </div>
  <div class="nav-actions">
    <div class="user-chip">
      <div class="user-avatar" id="userAvatar">U</div>
      <span id="userName">Trader</span>
    </div>
    <button class="btn btn-ghost" onclick="logoutUser()">Logout</button>
  </div>
</nav>

<!-- ================= SIDEBAR ================= -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-head">
    <div class="logo-wrap">
      <div class="logo-icon">₿</div>
      <span class="brand-gradient">NEXBIT</span>
    </div>
    <button class="sidebar-close" onclick="toggleSidebar()">✕</button>
  </div>
  <nav class="sidebar-menu">
    <a href="dashboard.html"  class="menu-item"><span class="mi-icon">🏠</span> Dashboard</a>
    <a href="deposit.html"    class="menu-item active"><span class="mi-icon">📥</span> Deposit</a>
    <a href="withdraw.html"   class="menu-item"><span class="mi-icon">📤</span> Withdraw</a>
    <div class="menu-divider"></div>
    <a href="market.html"     class="menu-item"><span class="mi-icon">📈</span> Markets</a>
    <a href="trade.html"      class="menu-item"><span class="mi-icon">💱</span> Trade</a>
    <a href="wallet.html"     class="menu-item"><span class="mi-icon">💰</span> Wallet</a>
    <a href="orders.html"     class="menu-item"><span class="mi-icon">📋</span> Orders</a>
    <a href="list-token.html" class="menu-item"><span class="mi-icon">🚀</span> List Token</a>
    <div class="menu-divider"></div>
    <a href="profile.html"    class="menu-item"><span class="mi-icon">👤</span> Profile</a>
    <a href="settings.html"   class="menu-item"><span class="mi-icon">⚙️</span> Settings</a>
    <div class="menu-divider"></div>
    <a href="#" class="menu-item" onclick="logoutUser(event)"><span class="mi-icon">🚪</span> Logout</a>
  </nav>
</aside>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
